name = "vbook-opds"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "vbook-library"
# Local placeholder. Keep the production ID in the ignored
# wrangler.production.toml file described in README.md.
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[vars]
DEFAULT_PAGE_SIZE = "50"
# Store GOOGLE_API_KEY and MASK_SECRET as Worker secrets, never in this file.
